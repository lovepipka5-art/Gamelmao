<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Ну и выбор</title>
<style>
:root{--bg:#101014;--panel:#19191f;--muted:#a5a5b3;--white:#f8f8fb;--acid:#d7ff4f;--pink:#ff4e91;--line:#33333e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#3b2454 0,transparent 44%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
button{font:inherit;cursor:pointer}.app{max-width:560px;min-height:100dvh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:1000;letter-spacing:-.8px;font-size:19px;display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;background:var(--acid);color:#171719;border-radius:13px;display:grid;place-items:center;font-weight:1000;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--pink)}.iconbtn{width:42px;height:42px;border-radius:14px;background:#202027;border:1px solid var(--line);color:white;font-size:20px}
.topline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;margin:5px 2px 8px}.round{color:var(--acid)}
h1{font-size:clamp(25px,7vw,36px);line-height:1.05;letter-spacing:-1.2px;margin:0 0 7px;font-weight:1000}h1 span{color:var(--acid)}.hint{margin:0 0 18px;color:var(--muted);font-size:13px}
.question{background:#1a1921;border:1px solid #393443;border-radius:20px;padding:16px 17px;margin-bottom:12px;position:relative;overflow:hidden}.question:after{content:"?";position:absolute;right:10px;top:-30px;font-size:110px;font-weight:1000;color:#ffffff08;pointer-events:none}.category{font-size:10px;font-weight:1000;letter-spacing:1.6px;color:var(--acid);text-transform:uppercase;margin-bottom:7px}h2{font-size:clamp(19px,5vw,25px);line-height:1.13;letter-spacing:-.6px;margin:0;position:relative;z-index:1}
.cards{display:flex;flex-direction:column;gap:11px}.choice{position:relative;overflow:hidden;text-align:left;width:100%;border:1px solid var(--line);border-radius:21px;padding:15px 16px 16px;background:var(--panel);color:var(--white);display:grid;grid-template-columns:42px 1fr 24px;gap:12px;align-items:start;min-height:128px;transition:transform .15s,border-color .15s}.choice:active{transform:scale(.99)}.choice.a{border-left:4px solid var(--pink)}.choice.b{border-left:4px solid var(--acid)}.choice.picked{border-color:var(--acid);background:#242a1b;box-shadow:0 0 0 1px #d7ff4f44}.choice:disabled{opacity:.6}.symbol{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#30202b;font-size:23px}.b .symbol{background:#2a301b}.choicebody{min-width:0}.letter{font-size:10px;font-weight:1000;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px}.label{font-size:17px;line-height:1.15;font-weight:950;letter-spacing:-.4px;margin-bottom:8px}.reward{font-size:12px;line-height:1.35;color:#e7e6ed}.reward strong{color:var(--acid);font-weight:900}.penalty{font-size:11px;line-height:1.35;color:#bdbbc8;margin-top:8px;padding-top:8px;border-top:1px dashed #45434f}.penalty strong{color:var(--pink);font-weight:900}.arrow{font-size:22px;color:#8b8998;align-self:center}.actions{display:flex;gap:9px;margin-top:14px}.primary,.secondary{border:0;border-radius:15px;padding:14px 13px;font-size:13px;font-weight:950}.primary{flex:1;background:var(--acid);color:#171719;box-shadow:0 4px 0 #91ac31}.secondary{background:#24232b;color:white;border:1px solid var(--line);min-width:52px}.status{display:none;margin-top:12px;padding:12px 14px;background:#22251a;border:1px solid #4c5b2b;border-radius:14px;font-size:12px;line-height:1.4}.status.show{display:block}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#777583;font-size:10px;padding-top:20px}.soundtag{color:var(--muted);font-size:11px}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:5;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.sheet{width:min(100%,560px);background:#1b1a22;border:1px solid #3b3945;border-radius:25px;padding:20px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 20px 80px #0008}.sheethead{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:1000;margin-bottom:16px}.menuitem{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:15px 13px;margin-top:8px;background:#25242d;border:1px solid #3a3845;border-radius:14px;color:white;font-weight:800}.menuitem small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.stats{display:none;padding:12px 0 2px}.stats.show{display:block}.statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#25242d;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:10px}
@media(max-height:740px){.hint{margin-bottom:12px}.question{padding:13px 15px;margin-bottom:9px}.choice{min-height:112px;padding:12px 13px}.label{font-size:16px}.actions{margin-top:10px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo">?!</div><span>НУ И ВЫБОР</span></div><button class="iconbtn" id="menuBtn" aria-label="Меню">☰</button></header>
<div class="topline"><span>ДИЛЕММА</span><span class="round" id="round">01 / ∞</span></div>
<h1>Выбирай. <span>Страдай.</span></h1>
<p class="hint">Два варианта. Оба сомнительные.</p>
<section class="question"><div class="category" id="category">АБСУРД</div><h2 id="title">Загружаем дилемму…</h2></section>
<section class="cards">
<button class="choice a" id="choiceA"><span class="symbol">💀</span><span class="choicebody"></span><span class="arrow">↗</span></button>
<button class="choice b" id="choiceB"><span class="symbol">🤡</span><span class="choicebody"></span><span class="arrow">↗</span></button>
</section>
<div class="status" id="status" aria-live="polite"></div>
<div class="actions"><button class="primary" id="nextBtn">СЛЕДУЮЩАЯ ДИЛЕММА →</button><button class="secondary" id="shareBtn" aria-label="Поделиться">↗</button></div>
<div class="bottom"><span>БЕЗ ХОРОШИХ РЕШЕНИЙ</span><span class="soundtag" id="soundTag">♫ ЗВУК ВЫКЛ.</span></div>
</main>
<div class="overlay" id="overlay"><div class="sheet">
<div class="sheethead"><span>МЕНЮ ИГРЫ</span><button class="iconbtn" id="closeMenu">×</button></div>
<button class="menuitem" id="menuNext"><span>🎲 Новая дилемма<small>Сбросить текущий выбор</small></span><span>→</span></button>
<button class="menuitem" id="soundBtn"><span>♫ Атмосферная музыка<small id="soundDescription">Сейчас выключена</small></span><span id="soundSwitch">OFF</span></button>
<button class="menuitem" id="statsBtn"><span>📊 Моя статистика<small>Сколько раз ты уже выбрал</small></span><span>＋</span></button>
<div class="stats" id="stats"><div class="statsgrid"><div class="stat"><b id="statTotal">0</b><span>ВЫБОРОВ</span></div><div class="stat"><b id="statA">0</b><span>ВАРИАНТ А</span></div><div class="stat"><b id="statB">0</b><span>ВАРИАНТ Б</span></div></div></div>
<button class="menuitem" id="resetBtn"><span>🧹 Сбросить статистику<small>Начать с чистого листа</small></span><span>↻</span></button>
</div></div>
<script>
const $=id=>document.getElementById(id);
let current=null,round=1,selected=null,mode="demo",audioCtx=null,oscillators=[],musicOn=false,musicTimer=null;
let seen=JSON.parse(localStorage.getItem("nivy_seen")||"[]"),history=JSON.parse(localStorage.getItem("nivy_history")||"[]");
const demo=[
{id:"local-1",title:"Твой кот становится гением",setup:"Он знает всё — и осуждает тебя.",a:{label:"Личный консультант",benefit:"Решает любую проблему за 5 минут.",cost:"Каждый совет заканчивается фразой: «Я бы на твоём месте не ел так позорно»."},b:{label:"Оставить как есть",benefit:"Дома спокойно и уютно.",cost:"Кот умеет говорить, но с тобой принципиально молчит."},category:"Абсурд"},
{id:"local-2",title:"Ты всегда выигрываешь любой спор",setup:"Даже когда несёшь полную чушь.",a:{label:"Побеждать всегда",benefit:"Никто не выставит тебя идиотом.",cost:"После каждой победы хор пенсионеров поёт гимн твоей неправоте."},b:{label:"Всегда знать ответ",benefit:"Ты никогда не ошибаешься в фактах.",cost:"Каждая твоя фраза звучит как скучная лекция."},category:"Социальный позор"},
{id:"local-3",title:"Твой двойник работает вместо тебя",setup:"Он может делать всё, что умеешь ты.",a:{label:"Скинуть всю рутину",benefit:"Бесконечно много свободного времени.",cost:"Он постит фото с подписью «Опять тащу этого бездельника»."},b:{label:"Отправлять на свидания",benefit:"Никаких неловких разговоров.",cost:"Он настолько обаятельный, что друзья зовут только его."},category:"Жизненный хаос"}
];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function card(side,letter){return `<div class="letter">ВАРИАНТ ${letter}</div><div class="label">${esc(side.label)}</div><div class="reward"><strong>ПЛЮС </strong>${esc(side.benefit)}</div><div class="penalty"><strong>ЦЕНА </strong>${esc(side.cost)}</div>`}
function render(d){current=d;selected=null;$("title").textContent=d.title;$("category").textContent=(d.category||"Абсурд").toUpperCase();$("round").textContent=String(round).padStart(2,"0")+" / ∞";$("choiceA").querySelector(".choicebody").innerHTML=card(d.a,"А");$("choiceB").querySelector(".choicebody").innerHTML=card(d.b,"Б");for(const id of ["choiceA","choiceB"]){$(id).disabled=false;$(id).classList.remove("picked")}hideStatus();}
function status(msg){$("status").textContent=msg;$("status").classList.add("show")}function hideStatus(){$("status").classList.remove("show")}
function pick(which){if(selected||!current)return;selected=which;let side=which==="a"?current.a:current.b;$("choice"+which.toUpperCase()).classList.add("picked");$("choice"+(which==="a"?"B":"A")).disabled=true;status((which==="a"?"ТЫ ВЫБРАЛ ВАРИАНТ А. ":"ТЫ ВЫБРАЛ ВАРИАНТ Б. ")+side.label+". Последствия приняты.");history.push({id:current.id,title:current.title,choice:which});seen.push({id:current.id,title:current.title,summary:current.setup});history=history.slice(-300);seen=seen.slice(-100);localStorage.setItem("nivy_history",JSON.stringify(history));localStorage.setItem("nivy_seen",JSON.stringify(seen));updateStats();beep(which==="a"?220:330,.12);}
function updateStats(){$("statTotal").textContent=history.length;$("statA").textContent=history.filter(x=>x.choice==="a").length;$("statB").textContent=history.filter(x=>x.choice==="b").length}
async function next(){const btn=$("nextBtn");btn.disabled=true;btn.textContent="ДУМАЕМ…";try{const r=await fetch("/api/dilemma",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seen:seen.map(x=>x.title+" — "+x.summary).slice(-12)})});if(!r.ok)throw Error();const d=await r.json();mode=d.mode||"ai";render(d);round++;}catch(e){let pool=demo.filter(d=>!seen.some(s=>s.id===d.id));render(pool.length?pool[Math.floor(Math.random()*pool.length)]:demo[Math.floor(Math.random()*demo.length)]);round++;if(mode==="ai")status("ИИ временно недоступен — показываем демо-дилемму.");}finally{btn.disabled=false;btn.textContent="СЛЕДУЮЩАЯ ДИЛЕММА →"}}
function beep(freq,duration){if(!musicOn)return;try{const ctx=audioCtx||startAudio();const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.025,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration+.03)}catch(e){}}
function startAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error("Audio unavailable");audioCtx=new AC();return audioCtx}
function toggleMusic(){musicOn=!musicOn;if(musicOn){try{const ctx=audioCtx||startAudio();ctx.resume();const melody=()=>{if(!musicOn)return;beep([110,164.8,220,146.8,196,130.8][Math.floor(Math.random()*6)],.8);musicTimer=setTimeout(melody,1100)};melody();}catch(e){musicOn=false;status("Браузер не поддерживает фоновый звук.")}}else{clearTimeout(musicTimer)}$("soundTag").textContent=musicOn?"♫ ЗВУК ВКЛ.":"♫ ЗВУК ВЫКЛ.";$("soundDescription").textContent=musicOn?"Сейчас включена":"Сейчас выключена";$("soundSwitch").textContent=musicOn?"ON":"OFF";}
$("choiceA").onclick=()=>pick("a");$("choiceB").onclick=()=>pick("b");$("nextBtn").onclick=next;$("menuBtn").onclick=()=>$("overlay").classList.add("show");$("closeMenu").onclick=()=>$("overlay").classList.remove("show");$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))$("overlay").classList.remove("show")});$("menuNext").onclick=()=>{$("overlay").classList.remove("show");next()};$("soundBtn").onclick=toggleMusic;$("statsBtn").onclick=()=>$("stats").classList.toggle("show");$("resetBtn").onclick=()=>{if(confirm("Удалить всю статистику?")){history=[];seen=[];localStorage.removeItem("nivy_history");localStorage.removeItem("nivy_seen");updateStats();status("Статистика сброшена.");$("overlay").classList.remove("show")}};
$("shareBtn").onclick=async()=>{if(!current)return;const t=`Ну и выбор: ${current.title}\nА) ${current.a.label}\nБ) ${current.b.label}`;try{if(navigator.share)await navigator.share({title:"Ну и выбор",text:t});else{await navigator.clipboard.writeText(t);status("Скопировано!")}}catch(e){}};
updateStats();(async()=>{try{const r=await fetch("/api/health");const h=await r.json();mode=h.mode||"demo"}catch(e){}render(demo[Math.floor(Math.random()*demo.length)])})();
</script>
</body></html>
